# Сборка мода, серверные GameTest и скриншоты настоящего клиента в Xvfb.
#
# В песочнице нет GPU и доступа к maven.fabricmc.net / серверам Mojang,
# поэтому вся реальная проверка идёт здесь. Логи джобов лежат на
# blob.core.windows.net (недоступен из песочницы), поэтому ошибки
# публикуются комментарием к коммиту через gh api.
name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build (includes server GameTests)
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Report errors as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ Build failed"
            echo ""
            echo '```'
            grep -E "error:|warning:|\.java:[0-9]+|What went wrong|Caused by:|Could not|Execution failed|GameTest" /tmp/build.log | sed 's/^[[:space:]]*//' | uniq | head -80
            echo '```'
          } > /tmp/report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/report.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: botmod-jar
          path: build/libs/
          if-no-files-found: warn

  screenshots:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      # Клиенту нужен программный рендерер (Mesa/llvmpipe) и виртуальный дисплей,
      # иначе он висит на создании окна.
      - name: Install Xvfb and Mesa software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri libopenal1

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Start Xvfb with 24-bit screen and GLX
        run: |
          # 24-битный экран обязателен: иначе Mesa не находит GLX visual.
          Xvfb :99 -screen 0 1600x900x24 +extension GLX +render -noreset -nolisten tcp &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Run client GameTest and capture screenshots
        run: |
          set -o pipefail
          # timeout гарантирует, что job не зависнет навсегда: 25 минут максимум.
          timeout 25m ./gradlew runProductionClientGameTest --stacktrace --no-daemon \
            -Dfabric.client.gametest.disableNetworkSynchronizer=true 2>&1 | tee /tmp/client.log
          echo "client exit code: ${PIPESTATUS[0]}"

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p docs/screenshots
          # Loom складывает скриншоты клиентских GameTest сюда.
          SRC="build/run/clientGameTest/screenshots"
          if [ -d "$SRC" ]; then
            cp "$SRC"/*.png docs/screenshots/ 2>/dev/null || true
          fi
          find build/run -name "*.png" 2>/dev/null | head -20 || true
          ls -la docs/screenshots || true

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "BotLab CI"
          git config user.email "actions@github.com"
          git add docs/screenshots || true
          if ! git diff --staged --quiet; then
            git commit -m "ci: client screenshots [skip ci]"
            git push
          else
            echo "no new screenshots"
          fi

      - name: Report client errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ Client GameTest failed"
            echo ""
            echo '```'
            grep -E "error|Exception|FAILED|Caused by|GameTest" /tmp/client.log | sed 's/^[[:space:]]*//' | uniq | head -60
            echo '```'
          } > /tmp/client-report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/client-report.md
