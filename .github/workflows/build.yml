# Сборка мода и автотесты на каждый push.
#
# В песочнице нет Java-инструментария и доступа к maven.fabricmc.net,
# поэтому единственный способ реально скомпилировать мод — GitHub Actions.
# Логи джобов лежат на blob.core.windows.net (недоступен из песочницы),
# поэтому ошибки публикуются комментарием к коммиту через gh api.
name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Report errors as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ Build failed"
            echo ""
            echo '```'
            grep -E "error:|warning:|\.java:[0-9]+|What went wrong|Caused by:|Could not|Execution failed" /tmp/build.log | sed 's/^[[:space:]]*//' | uniq | head -80
            echo '```'
          } > /tmp/report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/report.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: botmod-jar
          path: build/libs/
          if-no-files-found: warn
