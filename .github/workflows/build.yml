# Сборка мода, серверные GameTest и скриншоты настоящего клиента в Xvfb.
#
# В песочнице нет GPU и доступа к maven.fabricmc.net / серверам Mojang,
# поэтому вся реальная проверка идёт здесь. Логи джобов лежат на
# blob.core.windows.net (недоступен из песочницы), поэтому ошибки
# публикуются комментарием к коммиту через gh api.
name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Minecraft assets
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom/assets
            ~/.gradle/caches/fabric-loom/26.3
          key: mc-assets-26.3-${{ runner.os }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build (includes server GameTests)
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Report errors as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ Build failed"
            echo ""
            echo '```'
            grep -E "error:|warning:|symbol:|location:|\.java:[0-9]+|What went wrong|Caused by:|Could not|Execution failed|GameTest" /tmp/build.log | sed 's/^[[:space:]]*//' | uniq | head -80
            echo '```'
          } > /tmp/report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/report.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: botmod-jar
          path: build/libs/
          if-no-files-found: warn

      # Отдельный мод Kit Editor (kitmod) — тоже собираем и публикуем.
      # continue-on-error: ошибка KitMod не должна блокировать проверку арен.
      - name: Build KitMod
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew -p kitmod build --no-daemon 2>&1 | tee /tmp/kitmod.log

      - name: Report KitMod errors as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ KitMod build failed"
            echo ""
            echo '```'
            grep -E "error:|symbol:|location:|\.java:[0-9]+|What went wrong|Caused by:|Execution failed" /tmp/kitmod.log | sed 's/^[[:space:]]*//' | uniq | head -60
            echo '```'
          } > /tmp/kitmod-report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/kitmod-report.md

      # Готовые jar — в репозиторий, чтобы их можно было просто скачать.
      - name: Publish jar to releases/
        run: |
          mkdir -p releases
          rm -f releases/*.jar
          cp build/libs/*.jar releases/ 2>/dev/null || true
          cp kitmod/build/libs/kitmod-*.jar releases/ 2>/dev/null || true
          ls -la releases

      - name: Commit jar
        continue-on-error: true
        run: |
          git config user.name "BotLab CI"
          git config user.email "actions@github.com"
          git add releases || true
          if git diff --staged --quiet; then
            echo "no jar changes"
            exit 0
          fi
          git commit -m "ci: build jar [skip ci]"
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            echo "push attempt $attempt"
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "pushed"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::could not push jar after retries"
          exit 1

  screenshots:
    runs-on: ubuntu-24.04
    needs: build
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      # 26.3 просит у SDL sRGB-фреймбуфер: GLX в Xvfb такого visual не даёт
      # ("Couldn't find matching GLX visual"), а Vulkan падает без ICD.
      # Поэтому: Mesa (llvmpipe) + SDL offscreen (EGL, без X-сервера) + lavapipe.
      - name: Install Mesa software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 \
            libgl1 libegl1 libgles2 libglx-mesa0 libgl1-mesa-dri libopenal1

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Minecraft assets
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom/assets
            ~/.gradle/caches/fabric-loom/26.3
          key: mc-assets-26.3-${{ runner.os }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run client GameTest and capture screenshots
        env:
          # SDL offscreen рендерит через Mesa EGL: клиент стартует за секунды.
          SDL_VIDEO_DRIVER: offscreen
          SDL_VIDEO_FORCE_EGL: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
        run: |
          set -o pipefail
          timeout 20m ./gradlew runProductionClientGameTest --stacktrace --no-daemon \
            -Dfabric.client.gametest.disableNetworkSynchronizer=true 2>&1 | tee /tmp/client.log
          echo "client exit code: ${PIPESTATUS[0]}"

      - name: Store game logs in repo
        if: always()
        run: |
          mkdir -p docs/tests/ci/client-gametest
          DEST=docs/tests/ci/client-gametest
          if [ -f /tmp/client.log ]; then
            tail -n 1200 /tmp/client.log > "$DEST/client.log"
          fi
          # Что вообще лежит в build/run: скриншоты, миры, логи.
          {
            echo "== build/run tree =="
            find run build/run -maxdepth 3 -type d 2>/dev/null | head -40
            echo "== png files =="
            find run build/run -name "*.png" 2>/dev/null | head -40
            echo "== all logs =="
            find run build/run -name "*.log" 2>/dev/null | head -10
          } > "$DEST/artifacts.txt" 2>&1 || true
          # Лог самой игры и краш-репорты — там причина падения окна.
          find build/run -type f \( -name "latest.log" -o -name "*.log" -o -name "crash-*.txt" \) 2>/dev/null \
            | head -5 | while read -r f; do
                cp "$f" "$DEST/game-$(basename "$f")" 2>/dev/null || true
              done
          ls -la "$DEST" || true

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p docs/screenshots
          SRC="build/run/clientGameTest/screenshots"
          if [ -d "$SRC" ]; then
            cp "$SRC"/*.png docs/screenshots/ 2>/dev/null || true
          fi
          find run build/run -name "*.png" 2>/dev/null | head -20 || true
          ls -la docs/screenshots || true

      - name: Commit screenshots and logs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "BotLab CI"
          git config user.email "actions@github.com"
          git add docs/screenshots docs/tests || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci: client screenshots and logs [skip ci]"

          # Ветка может уехать вперёд (другой job или разработчик): ретраим push.
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            echo "push attempt $attempt"
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "pushed"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::could not push screenshots after retries"
          exit 1

      - name: Report client errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### ❌ Client GameTest failed"
            echo ""
            echo '```'
            grep -E "error|Exception|FAILED|Caused by|GameTest|SDL|GLX|EGL|OpenGL|Vulkan" /tmp/client.log \
              | sed 's/^[[:space:]]*//' | uniq | head -60
            echo '```'
          } > /tmp/client-report.md
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" -F body=@/tmp/client-report.md
